name: Gerar, auditar e publicar estudos

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Quantidade de estudos neste lote (1 recomendado; máximo 3)'
        required: false
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: generate-audit-all-studies
  cancel-in-progress: false

jobs:
  generate-audit-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar base
        run: |
          node --check app.js
          node --check sw.js
          node tests/validate-baseline.mjs
          node tests/validate-audit-policy.mjs
          node tests/validate-audit-cli.mjs

      - name: Gerar e auditar lote retomável
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_APK_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_GEMINI_API_KEY || secrets.GOOGLE_API_KEY || secrets.GEMINI }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_MODEL: '@cf/meta/llama-3.3-70b-instruct-fp8-fast'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || secrets.GROQ_CLOUD_API_KEY || secrets.GROQ }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          BATCH_SIZE='${{ inputs.batch_size || '1' }}'
          if ! [[ "$BATCH_SIZE" =~ ^[1-3]$ ]]; then echo 'batch_size deve ser 1, 2 ou 3'; exit 1; fi
          for attempt in $(seq 1 "$BATCH_SIZE"); do
            META=$(node scripts/prepare-next-study.mjs)
            if [ "$META" = 'QUEUE_COMPLETE' ]; then echo 'Todos os estudos da fila já foram aprovados.'; break; fi
            INPUT=$(printf '%s' "$META" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).input))")
            EVIDENCE=$(printf '%s' "$META" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).evidence))")
            echo "Processando $INPUT"
            STUDY_INPUT="$INPUT" EVIDENCE_DIR="$EVIDENCE" node scripts/run-pilot-audit.mjs
          done

      - name: Validar pacote publicado
        run: |
          node tests/validate-baseline.mjs
          node tests/validate-audit-cli.mjs
          git diff --check

      - name: Publicar estudos aprovados
        run: |
          if git diff --quiet -- content/studies-approved.json runs content/queue; then echo 'Nenhum estudo novo para publicar.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/studies-approved.json runs/*/evidence content/queue/all-chapter-studies.json
          git commit -m 'Publish next audited Bible studies'
          git push origin HEAD:main

      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studies-audit-evidence-${{ github.run_id }}
          path: runs/*/evidence/
          if-no-files-found: ignore
          retention-days: 14
