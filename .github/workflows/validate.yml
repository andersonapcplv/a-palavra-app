name: Validar baseline

on:
  push:
    branches: [main, stabilize-baseline, baseline-v0.6-import]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        run: node --check app.js && node --check sw.js && node --check scripts/validate-audit-package.mjs && node --check scripts/prepare-study-generation.mjs
      - name: Validar JSON e corpus
        run: node tests/validate-baseline.mjs
      - name: Validar política dos dois auditores
        run: node tests/validate-audit-policy.mjs
      - name: Exercitar CLI do gate com fixtures offline
        run: node tests/validate-audit-cli.mjs
      - name: Validar preparação offline do piloto
        run: node tests/validate-generation-input.mjs
      - name: Exercitar CLI do preparador sem APIs
        run: node scripts/prepare-study-generation.mjs content/queue/piloto-marcos-1-1-3-15.json /tmp/generation-input.json
